name: CI

# GitHub-maintained actions are pinned to release commits; comments record the corresponding tags.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-lint:
    name: config-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Validate site configuration
        run: python tools/check_config.py

      - name: Run Node-only config checks
        run: node tools/run-node-tests.js

  browser-tests:
    name: browser-tests
    runs-on: ubuntu-latest
    needs: config-lint
    env:
      PSYHUB_REQUIRE_JSDOM: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run browser-only tests in jsdom
        run: node tools/run-ui-tests-jsdom.js
