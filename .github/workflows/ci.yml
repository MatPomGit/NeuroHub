name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  config-lint:
    name: config-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Validate site configuration
        run: python tools/check_config.py

      - name: Run Node-only config checks
        run: node tools/run-node-tests.js

  browser-tests:
    name: browser-tests
    runs-on: ubuntu-latest
    needs: config-lint
    env:
      PSYHUB_REQUIRE_JSDOM: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run browser-only tests in jsdom
        run: node tools/run-ui-tests-jsdom.js
