name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  config-lint:
    name: config-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Validate site configuration
        run: python tools/check_config.py

      - name: Run Node-only config checks
        run: node tools/run-node-tests.js

  browser-tests:
    name: browser-tests
    runs-on: ubuntu-latest
    needs: config-lint
    env:
      PSYHUB_REQUIRE_JSDOM: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run browser-only tests in jsdom
        run: node tools/run-ui-tests-jsdom.js
