name: Build and deploy Jekyll to GitHub Pages

# GitHub-maintained actions are pinned to release commits; comments record the corresponding tags.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Validate generated artifact
        run: |
          test -f _site/index.html
          test -f _site/pages/trudne_zachowania_dziecka.html
          test -n "$(find _site/wiki -type f -name '*.html' -print -quit)"
          if find _site -type l -print -quit | grep -q .; then
            echo "GitHub Pages artifacts cannot contain symlinks." >&2
            exit 1
          fi
          du -sh _site
          find _site -type f | wc -l

      - name: Validate article canonical URLs
        run: node tools/check-generated-wiki-seo.js

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@decdde0ac072f6dda127f0c8b4df20f30b7a5afb # v4.0.5
