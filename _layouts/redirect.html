<!doctype html>
<html lang="{{ site.lang | default: 'pl' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
</head>
<body>
  <p>
    Artykuł został scalony z opracowaniem kanonicznym.
    <a href="{{ page.redirect_to | relative_url }}">Przejdź do aktualnej wersji</a>.
  </p>
  <script>
    window.location.replace({{ page.redirect_to | relative_url | jsonify }});
  </script>
</body>
</html>
