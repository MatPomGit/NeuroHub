<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'pl' }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a12">
  <meta name="color-scheme" content="dark light">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/brain.ico' | relative_url }}" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/design-tokens.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/typography.css' | relative_url }}">
  <style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--t1);
      font-family:var(--sans);
    }
    a{color:var(--blue)}
    .reading-progress{position:fixed;inset:0 auto auto 0;width:0;height:3px;z-index:30;background:var(--accent-gradient)}
    .wiki-topbar{
      position:sticky;top:0;z-index:20;
      width:100%;min-height:52px;margin:0;padding:.4rem max(1rem,calc((100% - 1120px)/2));
      display:flex;align-items:center;justify-content:space-between;gap:1rem;
      border:0;border-bottom:1px solid var(--border);background:var(--topbar-bg);
      box-shadow:none;backdrop-filter:blur(16px);
    }
    .wiki-brand{display:flex;align-items:center;gap:.7rem;color:var(--t1);font-family:var(--serif);font-weight:800;text-decoration:none}
    .wiki-brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--accent-gradient)}
    .wiki-nav{display:flex;align-items:center;gap:.5rem}
    .wiki-nav a{padding:.42rem .6rem;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--t2);font-weight:700;text-decoration:none}
    .wiki-nav a:hover{border-color:var(--gold);color:var(--t1)}
    .wiki-main{width:min(920px,calc(100% - 32px));margin:clamp(1.2rem,3vw,2.5rem) auto 6rem}
    .wiki-context{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:0 0 .8rem;padding:0 .35rem;color:var(--t3)}
    .wiki-context-label{letter-spacing:.13em;text-transform:uppercase}
    .wiki-article{
      position:relative;
      padding:clamp(1rem,3vw,2rem) 0 3rem;
      border:0;border-top:1px solid var(--border);
      background:transparent;box-shadow:none;
    }
    .wiki-article>h1:first-child{
      position:relative;max-width:18ch;margin:.2rem 0 2rem;
      font-family:var(--serif);font-weight:800;letter-spacing:-.05em;
    }
    h2,h3,h4{font-family:var(--serif);line-height:1.22;letter-spacing:-.035em;scroll-margin-top:100px}
    h2{max-width:74ch;margin:2.8rem 0 .9rem;padding-bottom:.55rem;border-bottom:1px solid var(--border)}
    h3{max-width:74ch;margin:2.1rem 0 .7rem}
    p,li{max-width:74ch}
    p{color:var(--t2)}
    li{margin:.28rem 0}
    blockquote{max-width:74ch;margin:1.5rem 0;padding:.9rem 1.1rem;border-left:3px solid var(--gold);border-radius:0 8px 8px 0;background:linear-gradient(90deg,var(--goldt),transparent)}
    code{padding:.13em .38em;border-radius:6px;background:var(--bg3);font-family:var(--mono)}
    pre{overflow:auto;padding:1rem;border:1px solid var(--border);border-radius:14px;background:#070b12}
    pre code{padding:0;background:none}
    table{display:block;max-width:100%;overflow:auto;border-collapse:collapse;border-radius:14px}
    th,td{padding:.72rem;border:1px solid var(--border);text-align:left}
    th{background:var(--surface-soft)}
    img{max-width:100%;height:auto;border-radius:8px}
    hr{margin:3rem 0;border:0;border-top:1px solid var(--border)}
    .wiki-source{margin:3.5rem 0 0;padding-top:1rem;border-top:1px solid var(--border);color:var(--t3)}
    @media (max-width:640px){
      .wiki-topbar{min-height:48px;padding:.35rem .75rem}
      .wiki-brand-mark{width:36px;height:36px}
      .wiki-nav a:first-child{display:none}
      .wiki-main{margin-top:1rem}
      .wiki-article{padding:1rem 0 2.5rem}
    }
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <div class="reading-progress" id="readingProgress" aria-hidden="true"></div>
  <header class="wiki-topbar">
    <a class="wiki-brand" href="{{ '/' | relative_url }}">
      <span class="wiki-brand-mark" aria-hidden="true">🧠</span>
      <span>PsyHub</span>
    </a>
    <nav class="wiki-nav" aria-label="Nawigacja strony">
      <a href="{{ '/' | relative_url }}">Strona główna</a>
      <a href="{{ '/' | relative_url }}">Otwórz portal →</a>
    </nav>
  </header>
  <main class="wiki-main">
    <div class="wiki-context">
      <span class="wiki-context-label">Artykuł PsyHub</span>
      <span>Treść generowana przez Jekyll</span>
    </div>
    <article class="wiki-article">
      {{ content }}
      <p class="wiki-source">Źródło: <code>{{ page.source_path }}</code></p>
    </article>
  </main>
  <script src="{{ '/site-config.js' | relative_url }}"></script>
  <script src="{{ '/modules/article-links.js' | relative_url }}"></script>
  <script>
    (function(){
      const bar=document.getElementById('readingProgress');
      const entries=(window.SITE_CONFIG?.nav||[]).flatMap(section=>section.items||[]);
      const current=entries.find(entry=>entry.file==={{ page.source_path | jsonify }});
      const root={{ '/' | relative_url | jsonify }};
      window.PsyHubArticleLinks?.linkCanonicalTopics(
        document.querySelector('.wiki-article'),
        current?.id,
        entries,
        {
          hrefForId(id,topic){
            const target=entries.find(entry=>entry.id===id);
            if(!target?.file)return `${root}#${id}`;
            return `${root}${target.file.replace(/\.md$/i,'.html')}`;
          }
        }
      );
      function update(){
        const max=document.documentElement.scrollHeight-window.innerHeight;
        bar.style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%';
      }
      window.addEventListener('scroll',update,{passive:true});update();
    })();
  </script>
</body>
</html>
