<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Cztery uzupełniające się miary dostarczania oprogramowania</title>
  <desc id="desc">Schemat dzieli cztery miary na tempo dostarczania i stabilność usługi. Tempo obejmuje częstotliwość wdrożeń oraz czas realizacji zmiany, a stabilność odsetek zmian powodujących awarię oraz czas przywrócenia usługi.</desc>
  <rect width="900" height="500" rx="18" fill="#f8fafc"/>
  <text x="450" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#172033">Wydajność dostarczania: tempo i stabilność</text>
  <rect x="65" y="85" width="370" height="340" rx="18" fill="#eef4ff" stroke="#84adff" stroke-width="2"/>
  <rect x="465" y="85" width="370" height="340" rx="18" fill="#ecfdf3" stroke="#6ce9a6" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <text x="250" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#1849a9">Tempo dostarczania</text>
    <text x="650" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#05603a">Stabilność usługi</text>
    <rect x="100" y="160" width="300" height="90" rx="14" fill="#ffffff" stroke="#b2ccff"/>
    <text x="250" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Częstotliwość wdrożeń</text>
    <text x="250" y="222" text-anchor="middle" font-size="15" fill="#475467">jak często organizacja wdraża zmiany</text>
    <rect x="100" y="280" width="300" height="90" rx="14" fill="#ffffff" stroke="#b2ccff"/>
    <text x="250" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Czas realizacji zmiany</text>
    <text x="250" y="342" text-anchor="middle" font-size="15" fill="#475467">od zatwierdzenia kodu do produkcji</text>
    <rect x="500" y="160" width="300" height="90" rx="14" fill="#ffffff" stroke="#a6f4c5"/>
    <text x="650" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Odsetek nieudanych zmian</text>
    <text x="650" y="222" text-anchor="middle" font-size="15" fill="#475467">wdrożenia wymagające naprawy</text>
    <rect x="500" y="280" width="300" height="90" rx="14" fill="#ffffff" stroke="#a6f4c5"/>
    <text x="650" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Czas przywrócenia usługi</text>
    <text x="650" y="342" text-anchor="middle" font-size="15" fill="#475467">czas usunięcia skutków awarii</text>
    <text x="450" y="463" text-anchor="middle" font-size="16" fill="#475467">Interpretacja jednej miary bez pozostałych może prowadzić do błędnych wniosków.</text>
  </g>
</svg>
