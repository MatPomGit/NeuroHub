<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070a12">
  <meta name="color-scheme" content="dark light">
  <meta name="google-site-verification" content="6rxzGHXJtmpyj20hBi0v7yX1h8KpN2fEgueFU1M8Flc" />
  <meta name="description" content="PsyHub - portal wiedzy psychologicznej z artykułami, testami i materiałami edukacyjnymi.">
  <meta property="og:title" content="PsyHub - Portal wiedzy psychologicznej">
  <meta property="og:description" content="PsyHub - portal wiedzy psychologicznej z artykułami, testami i materiałami edukacyjnymi.">
  <meta property="og:type" content="website">
  <title>PsyHub - Portal Wiedzy Psychologicznej</title>
  <link rel="icon" href="assets/brain.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="academic-compact.css">
  <script src="anime.min.js" defer></script>
  <script src="site-config.js" defer></script>
  <script src="specialization-test.js" defer></script>
  <script src="daily-psychology.js" defer></script>
  <script src="theoretical-test.js" defer></script>
  <script src="modules/tests-ui.js" defer></script>
  <script src="modules/article-links.js" defer></script>
  <script src="measurement-tools-validator.js" defer></script>
  <script src="app.js" defer></script>
  <script src="app-md-loader.js" defer></script>
  <script src="seo-runtime.js" defer></script>
</head>
<body class="psyhub-app">
<a class="skip-link" href="#content">Przejdź do treści głównej</a>

<aside class="sidebar" id="sidebar">
  <button type="button" class="s-logo" id="sidebarLogo" aria-label="Przejdź do strony głównej">
    <div class="s-logo-mark">🧠</div>
    <div>
      <div class="s-logo-name">PsyHub</div>
      <div class="s-logo-sub">Portal wiedzy</div>
    </div>
  </button>

  <div class="s-search">
    <div class="s-search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <label class="sr-only" for="searchInput">Wyszukaj artył</label>
      <input type="text" id="searchInput" placeholder="Szukaj artykułu…" autocomplete="off" aria-describedby="searchResults">
    </div>
    <div class="s-filter-shortcuts" id="searchFilterShortcuts" aria-label="Skróty filtrów wyszukiwania">
      <button type="button" class="s-filter-btn" data-filter="tests">Tylko testy</button>
      <button type="button" class="s-filter-btn" data-filter="wiki">Tylko wiki</button>
      <button type="button" class="s-filter-btn" data-filter="beginner">Początkujący</button>
    </div>
    <div class="s-search-results" id="searchResults" aria-live="polite"></div>
  </div>

  <nav class="s-nav" id="sidebarNav" aria-label="Nawigacja boczna"></nav>

  <div class="s-footer">
    <span>PsyHub v3.2</span>
    <div class="theme-btns">
      <button class="theme-btn is-active" data-theme="dark" title="Motyw ciemny" aria-label="Włącz motyw ciemny" aria-pressed="true"></button>
      <button class="theme-btn" data-theme="light" title="Motyw jasny" aria-label="Włącz motyw jasny" aria-pressed="false"></button>
      <button class="theme-btn" data-theme="sepia" title="Motyw sepia" aria-label="Włącz motyw sepia" aria-pressed="false"></button>
      <button class="theme-btn" data-theme="ocean" title="Motyw ocean" aria-label="Włącz motyw ocean" aria-pressed="false"></button>
      <button class="theme-btn" data-theme="forest" title="Motyw forest" aria-label="Włącz motyw forest" aria-pressed="false"></button>
      <button class="theme-btn" data-theme="sunset" title="Motyw sunset" aria-label="Włącz motyw sunset" aria-pressed="false"></button>
    </div>
    <div class="font-size-controls" aria-label="Ustawienia wielkości czcionki">
      <button type="button" class="font-btn" data-font-scale="normal" title="Standardowa wielkość" aria-label="Standardowa wielkość">A</button>
      <button type="button" class="font-btn" data-font-scale="large" title="Powiększona czcionka" aria-label="Powiększona czcionka">A+</button>
      <button type="button" class="font-btn" data-font-scale="xlarge" title="Bardzo duża czcionka" aria-label="Bardzo duża czcionka">A++</button>
    </div>
    <details class="interface-settings">
      <summary>Ustawienia interfejsu</summary>
      <label class="interface-setting" for="showSpeechControls">
        <span>Czytanie artykułu</span>
        <input type="checkbox" id="showSpeechControls">
      </label>
      <label class="interface-setting" for="showSearchFilters">
        <span>Skróty wyszukiwania</span>
        <input type="checkbox" id="showSearchFilters">
      </label>
    </details>
    <span class="ver">bulbulgator</span>
  </div>
</aside>

<div class="overlay" id="overlay"></div>

<main class="main" id="mainContent">
  <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>

  <header class="topbar">
    <button class="btn-menu" id="mobileMenuButton" type="button" aria-label="Otwórz menu nawigacyjne">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <button class="btn-mobile-chapters" id="mobileChaptersButton" type="button" aria-label="Pokaż główne rozdziały" aria-expanded="false" aria-controls="mobileChaptersPanel">Rozdziały</button>
    <button class="btn-mobile-toc" id="mobileWikiTocButton" type="button" aria-label="Pokaż spis treści artykułu wiki" aria-expanded="false" aria-controls="mobileWikiTocPanel" hidden>Spis treści</button>
    <button class="btn-mobile-extra-pages" id="mobileExtraPagesButton" type="button" aria-label="Przejdź do listy dodatkowych stron">Dodatkowe strony</button>
    <nav class="breadcrumb" id="breadcrumb" aria-label="Okruszki nawigacji">
      <a href="#" id="breadcrumbHomeLink">PsyHub</a>
    </nav>
    <div class="topbar-next" id="topbarNextStep" aria-live="polite"></div>
    <div class="speech-controls" aria-label="Czytanie treści na głos" hidden>
      <button type="button" class="speech-btn" id="speechToggle" aria-pressed="false" aria-label="Rozpocznij czytanie bieżącego artykułu" title="Rozpocznij czytanie artykułu">▶ Czytaj artykuł</button>
      <button type="button" class="speech-btn speech-collapse-btn" id="speechOptionsToggle" aria-expanded="true" aria-controls="speechOptionsPanel" aria-label="Zwiń panel opcji czytania na głos" title="Zwiń lub rozwiń opcje czytania">Opcje ▲</button>
      <div class="speech-options-panel" id="speechOptionsPanel">
        <button type="button" class="speech-btn" id="speechStop" aria-label="Zatrzymaj czytanie" title="Zatrzymaj czytanie artykułu">■ Stop</button>
        <button type="button" class="speech-btn" id="speechAutoNext" aria-pressed="false" aria-label="Automatyczne przejście do kolejnego artykułu wyłączone" title="Automatyczne przejście do kolejnego artykułu">Auto-next: OFF</button>
        <label class="speech-voice-select-wrap" for="speechVoiceMode">Głos:
          <select class="speech-voice-select" id="speechVoiceMode" aria-label="Wybierz styl głosu czytającego">
            <option value="natural">Naturalny</option>
            <option value="alt">Alternatywny</option>
            <option value="calm">Spokojny</option>
            <option value="dynamic">Dynamiczny</option>
            <option value="deep">Niski</option>
          </select>
        </label>
      </div>
    </div>
  </header>
  <section class="mobile-chapters-panel" id="mobileChaptersPanel" aria-label="Główne rozdziały serwisu" hidden>
    <div class="mobile-chapters-list" id="mobileChaptersList"></div>
  </section>
  <section class="mobile-wiki-toc-panel" id="mobileWikiTocPanel" aria-label="Spis treści bieżącego artykułu wiki" hidden></section>

  <section class="content" id="content" aria-live="polite" tabindex="-1">
    <div class="loading"><div class="spinner"></div>Ładowanie…</div>
  </section>
</main>
</body>
</html>
