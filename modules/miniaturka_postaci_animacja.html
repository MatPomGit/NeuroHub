<!-- Animowana miniaturka postaci -->
<div class="running-character" aria-hidden="true">
  <img src="assets/img/postac.png" alt="">
</div>

<style>
  .running-character {
    position: fixed;
    left: 0;
    bottom: 12px;
    width: 110px;
    height: 110px;
    z-index: 9999;
    pointer-events: none;

    animation: run-across-screen 8s linear infinite;
    will-change: transform;
  }

  .running-character img {
    width: 100%;
    height: 100%;
    object-fit: contain;

    /*
      Delikatna animacja „biegu”.
      Nie deformuje mocno postaci, tylko daje wrażenie ruchu.
    */
    animation: running-bob 0.38s ease-in-out infinite alternate;
    filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.35));
  }

  @keyframes run-across-screen {
    from {
      transform: translateX(calc(100vw + 140px));
    }

    to {
      transform: translateX(-160px);
    }
  }

  @keyframes running-bob {
    from {
      transform: translateY(0) rotate(-1.5deg);
    }

    to {
      transform: translateY(-8px) rotate(1.5deg);
    }
  }

  /*
    Opcjonalnie: ograniczenie animacji dla osób,
    które mają w systemie ustawione redukowanie ruchu.
  */
  @media (prefers-reduced-motion: reduce) {
    .running-character,
    .running-character img {
      animation: none;
    }

    .running-character {
      transform: translateX(20px);
    }
  }
</style>
